<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فلوسي - مهند الحريري - كوم دميس</title><style>@import url('https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@900&display=swap');*{margin:0;padding:0;box-sizing:border-box}body{background:#08080f;color:#fff;font-family:'Cairo'}nav{display:flex;justify-content:space-between;padding:14px 20px;background:#000;border-bottom:3px solid #8A2BE2} .logo{font-family:'Anton'} .logo span{background:linear-gradient(90deg,#8A2BE2,#00F5FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hero{padding:32px 20px;text-align:center}.big{font-family:'Anton';font-size:76px;line-height:.85;transform:rotate(-3deg)}.big .c1{background:linear-gradient(90deg,#8A2BE2,#FF006E);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:h 3s infinite linear}.big .c2{color:#00F5FF;text-shadow:0 0 25px #00F5FF;animation:f 2s infinite}@keyframes h{to{filter:hue-rotate(360deg)}}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.from{margin-top:12px;color:#999}.from b{color:#8A2BE2}.money{position:absolute;font-size:34px;animation:fly 3.5s linear infinite}.m1{top:10%;left:12%}.m2{top:30%;right:12%;animation-delay:.7s}.m3{top:60%;left:20%;animation-delay:1.4s}@keyframes fly{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-110px);opacity:0}}.card{background:rgba(255,255,255,.06);margin:20px;padding:24px;border-radius:20px;border:1px solid rgba(138,43,226,.3)}.card input{width:100%;padding:16px;margin:6px 0 14px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:19px;font-weight:900}.btn{width:100%;padding:18px;background:linear-gradient(90deg,#8A2BE2,#FF006E,#00F5FF);background-size:200%;border:none;border-radius:14px;color:#fff;font-family:'Anton';font-size:26px;animation:g 3s linear infinite}@keyframes g{0%{background-position:0%}100%{background-position:200%}}.res{margin:20px;padding:24px;background:linear-gradient(135deg,rgba(138,43,226,.15),rgba(0,245,255,.12));border-radius:20px;display:none}.bar{height:40px;background:#000;border-radius:30px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0%;background:linear-gradient(90deg,#8A2BE2,#00F5FF);transition:width 1.6s ease;display:flex;align-items:center;justify-content:center;font-family:'Anton'}.footer{text-align:center;padding:20px;color:#555;font-size:11px}</style></head><body><nav><div class="logo">مهند <span>الحريري</span></div><div style="color:#666;font-size:12px">ELHARIRY 88</div></nav><div class="hero" style="position:relative"><div class="money m1">💸</div><div class="money m2">🪙</div><div class="money m3">💎</div><div class="big"><span class="c1">فلوسي</span><br>راحت<br><span class="c2">فين؟</span></div><div class="from">من <b>كوم دميس</b> • بواسطة <b>مهند الحريري</b> 🔥</div></div><div class="card"><label>مرتبك كام؟ 💵</label><input id="s" type="number" placeholder="5000"><label>إيجار؟ 🏠</label><input id="r" type="number" placeholder="1500"><label>أكل؟ 🍔</label><input id="f" type="number" placeholder="2000"><label>مواصلات؟ 🛵</label><input id="o" type="number" placeholder="500"><button class="btn" onclick="calc()">احسب يا مهند ✨</button></div><div id="res" class="res"><h2 id="txt" style="font-family:'Anton';font-size:36px"></h2><div class="bar"><div id="fill" class="fill">0%</div></div><p id="msg"></p></div><div class="footer">Made with 💜 by مهند الحريري - كوم دميس</div><script>function calc(){let s=+document.getElementById('s').value||0,r=+document.getElementById('r').value||0,f=+document.getElementById('f').value||0,o=+document.getElementById('o').value||0;if(!s){alert('اكتب مرتبك يا مهند!');return}let left=s-(r+f+o),p=s?Math.max(0,Math.round(left/s*100)):0;let res=document.getElementById('res'),txt=document.getElementById('txt'),fill=document.getElementById('fill'),msg=document.getElementById('msg');res.style.display='block';txt.innerText='فاضل معاك: '+left+' جنيه';fill.style.width='0%';setTimeout(()=>{fill.style.width=p+'%';fill.innerText=p+'%'},100);msg.innerText=left<0?'💀 بتصرف أكتر من مرتبك يا مهند!':left>2500?'🔥 جامد يا ابن كوم دميس':'😎 ماشي حالك';res.scrollIntoView({behavior:'smooth'})}</script></body></html>
