<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>فلوسي راحت فين؟</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Impact}body{background:#0a0a0a;color:white}nav{display:flex;justify-content:space-between;padding:15px;background:black;border-bottom:4px solid #FFE600}.hero{padding:20px}.big{font-size:55px;line-height:0.9}.big span{color:#FFE600}.card{background:white;color:black;margin:20px;padding:20px;border:4px solid #FFE600}input{width:100%;padding:15px;margin:8px 0;border:4px solid black;font-weight:900;font-size:18px}button{background:#FFE600;color:black;border:4px solid black;padding:15px;width:100%;font-weight:900;font-size:22px}.result{margin:20px;background:#FFE600;color:black;padding:20px;border:4px solid white;display:none}.bar{height:35px;background:black;margin:10px 0}.bar-fill{height:100%;background:white;width:0%;transition:2s;display:flex;align-items:center;justify-content:center;color:black;font-weight:900}</style></head><body><nav><div>ELHARIRY 88</div><div><a href="index.html" style="color:white;text-decoration:none">HOME</a></div></nav><div class="hero"><div class="big">فلوسي<br>راحت<br><span>فين؟ 💸</span></div><p style="color:#888">من كفر المرازقة</p></div><div class="card"><input id="s" type="number" placeholder="مرتبك كام؟ 5000"><input id="r" type="number" placeholder="إيجار؟ 1500"><input id="f" type="number" placeholder="أكل وشرب؟ 2000"><input id="o" type="number" placeholder="مواصلات؟ 500"><button onclick="calc()">احسب 💰</button></div><div id="res" class="result"><h2 id="txt"></h2><div class="bar"><div id="fill" class="bar-fill">0%</div></div><p id="msg"></p></div><script>function calc(){let s=+document.getElementById('s').value||0,r=+document.getElementById('r').value||0,f=+document.getElementById('f').value||0,o=+document.getElementById('o').value||0,left=s-(r+f+o),p=s?Math.max(0,Math.round((left/s)*100)):0;document.getElementById('res').style.display='block';document.getElementById('txt').innerText='فاضل معاك: '+left+' جنيه';document.getElementById('fill').style.width=p+'%';document.getElementById('fill').innerText=p+'%';document.getElementById('msg').innerText=left>1000?'جامد بتحوش 🔥':left>0?'حاسب الشهر طويل ⚠️':'بتصرف اكتر ما بتقبض 💀'}</script></body></html>
